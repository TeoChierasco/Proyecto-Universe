<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 130" role="img" aria-label="Instituto Universe">
  <defs>
    <linearGradient id="circ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccf3f"/>
      <stop offset="100%" stop-color="#6fa617"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: círculo verde con "UV" -->
  <circle cx="63" cy="65" r="58" fill="url(#circ)"/>
  <text x="55" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="60" fill="#ffffff" letter-spacing="-2">UV</text>

  <!-- Wordmark: universe -->
  <text x="135" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="60" letter-spacing="-2">
    <tspan font-weight="800" fill="#3f4a37">uni</tspan><tspan font-weight="400" fill="#79876b">verse</tspan>
  </text>
</svg>
