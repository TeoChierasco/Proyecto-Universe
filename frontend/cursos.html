<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instituto Universe — Cursos y divisiones</title>
  <link rel="icon" type="image/svg+xml" href="/assets/isotipo.svg" />
  <script>document.documentElement.dataset.tema = localStorage.getItem('iu_tema') || 'claro';</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="contenido">
    <header class="barra-superior">
      <a href="/panel.html" class="enlace-volver">← Volver al panel</a>
      <div id="zona-usuario"></div>
    </header>

    <main class="main-top">
      <div class="aparecer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="panel-cabecera">
          <h1><span class="destello">Cursos y divisiones</span></h1>
          <p class="subtitulo" id="subtitulo">Nómina de alumnos y docentes por curso</p>
        </div>

        <div class="aviso-info aviso-sin-curso" id="aviso-sin-curso" hidden></div>

        <div class="anios-lista lista-ancha" id="cursos">
          <p class="cargando">Cargando cursos…</p>
        </div>

        <!-- Detalle del curso seleccionado -->
        <section class="detalle-curso lista-ancha" id="detalle" hidden></section>
      </div>
    </main>

    <footer class="pie">© 2026 Instituto Universe</footer>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let estado = { cursos: [], seleccionado: null };

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    async function api(ruta) {
      const r = await fetch(ruta, { headers: { Authorization: `Bearer ${App.obtenerToken()}` } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'Ocurrió un error.');
      return data;
    }

    function renderCursos() {
      const cont = document.getElementById('cursos');
      if (!estado.cursos.length) {
        cont.innerHTML = '<p class="cargando">No hay divisiones cargadas. Crealas desde <a href="/plan.html">Plan de estudios</a>.</p>';
        return;
      }

      const anios = [...new Set(estado.cursos.map((c) => c.anio))];
      cont.innerHTML = anios.map((anio) => `
        <div class="anio-bloque">
          <h2 class="anio-titulo">${anio}.º año</h2>
          <div class="cursos-grilla">
            ${estado.cursos.filter((c) => c.anio === anio).map((c) => `
              <button class="tarjeta-curso ${estado.seleccionado === c.id ? 'activa' : ''}" data-curso="${c.id}">
                <span class="curso-nombre">${c.anio}.º ${esc(c.division)}</span>
                <span class="curso-dato"><strong>${c.alumnos}</strong> alumno${c.alumnos === 1 ? '' : 's'}</span>
                <span class="curso-dato ${c.materias && c.materiasConDocente < c.materias ? 'alerta' : ''}">
                  ${c.materiasConDocente}/${c.materias} materias con docente
                </span>
                <span class="curso-dato ${c.horario && c.horario.definida && !c.horario.completo ? 'alerta' : ''}">
                  ${!c.horario || !c.horario.definida ? 'Jornada sin definir'
                    : c.horario.completo ? `Horario completo · ${c.horario.modulosJornada} mód.`
                    : `Horario: ${c.horario.modulosCargados}/${c.horario.modulosJornada} mód.`}
                </span>
              </button>`).join('')}
          </div>
        </div>`).join('');

      cont.querySelectorAll('[data-curso]').forEach((b) =>
        b.addEventListener('click', () => seleccionar(Number(b.dataset.curso))));
    }

    async function apiEnviar(metodo, ruta, body) {
      const r = await fetch(ruta, {
        method: metodo,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${App.obtenerToken()}` },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'Ocurrió un error.');
      return data;
    }

    async function recargarResumen() {
      try { estado.cursos = (await api('/api/cursos')).cursos; renderCursos(); } catch (e) { /* sin cambios */ }
    }

    async function seleccionar(id, silencioso) {
      estado.seleccionado = id;
      renderCursos();
      const det = document.getElementById('detalle');
      det.hidden = false;
      if (!silencioso) {
        det.innerHTML = '<p class="cargando">Cargando curso…</p>';
        det.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      try {
        const data = await api(`/api/cursos/${id}`);
        renderDetalle(data);
      } catch (error) {
        det.innerHTML = `<p class="cargando">${esc(error.message)}</p>`;
      }
    }

    const ESTADO_DIA = {
      completo: ['nivel-normal', 'Completo'],
      incompleto: ['nivel-atencion', 'Faltan módulos'],
      fuera: ['nivel-critico', 'Clases fuera de jornada'],
      sin_jornada: ['', 'No cursa'],
    };

    function bloqueJornada(curso, horario, modulos) {
      if (!horario) return '<p class="ayuda-campo">Para controlar el horario corré backend/db/horarios.sql y jornadas.sql en Supabase.</p>';
      if (horario.sinTablaJornadas) return '<p class="ayuda-campo">Para definir la jornada corré backend/db/jornadas.sql en Supabase.</p>';
      const opt = (campo, sel) => '<option value="">—</option>' + modulos.map((m) =>
        `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${m.id}.º · ${campo === 'desde' ? m.inicio : m.fin}</option>`).join('');
      const s = horario.control.semana;
      return `
        <table class="planilla tabla-jornada">
          <thead><tr><th class="col-alumno">Día</th><th>Desde</th><th>Hasta</th><th>Jornada</th><th>En el horario</th><th>Control</th></tr></thead>
          <tbody>
            ${horario.control.dias.map((d) => {
              const [clase, texto] = ESTADO_DIA[d.estado];
              return `<tr data-dia="${d.dia}">
                <td class="col-alumno"><strong>${esc(d.nombre)}</strong></td>
                <td><select class="input-mini" data-campo="desde">${opt('desde', d.jornada && d.jornada.desde)}</select></td>
                <td><select class="input-mini" data-campo="hasta">${opt('hasta', d.jornada && d.jornada.hasta)}</select></td>
                <td>${d.jornada ? `${d.modulosJornada} mód. · ${esc(d.horasJornada)}` : '—'}</td>
                <td>${d.modulosCargados} mód.${d.modulosCargados ? ` · ${esc(d.horasCargadas)}` : ''}</td>
                <td>${clase ? `<span class="nivel-faltas ${clase}">${texto}${d.estado === 'incompleto' ? ` (${d.faltan})` : d.estado === 'fuera' && d.fuera ? ` (${d.fuera})` : ''}</span>` : `<span class="codigo-meta">${texto}</span>`}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr><td class="col-alumno"><strong>Semana</strong></td><td></td><td></td>
            <td><strong>${s.modulosJornada} mód.</strong></td><td><strong>${s.modulosCargados} mód.</strong></td>
            <td>${!s.definida ? '<span class="codigo-meta">Definí la jornada</span>' : s.completo ? '<span class="nivel-faltas nivel-normal">Coherente</span>' : '<span class="nivel-faltas nivel-atencion">Revisar</span>'}</td></tr></tfoot>
        </table>
        <p class="ayuda-campo">Elegí el primer y el último módulo de cada día. El horario de ese día tiene que cubrir exactamente esos módulos: no se pueden cargar clases fuera de la jornada.</p>`;
    }

    function renderDetalle({ curso, alumnos, materias, totalDocumentos, horario, modulos }) {
      const det = document.getElementById('detalle');
      const sinDocente = materias.filter((m) => !m.profesor).length;
      const legajosIncompletos = alumnos.filter((a) => !a.legajoCompleto).length;

      det.innerHTML = `
        <div class="detalle-cabecera">
          <h2 class="titulo-seccion">${curso.anio}.º ${esc(curso.division)}</h2>
          <div class="detalle-acciones">
            <a class="btn-mini" href="/alumnos.html">Asignar alumnos</a>
            <a class="btn-mini" href="/profesores.html">Asignar docentes</a>
            <a class="btn-mini" href="/horarios.html?curso=${curso.id}">Abrir horario</a>
          </div>
        </div>

        <div class="detalle-columnas">
          <div class="anio-bloque">
            <span class="sub-titulo">Nómina · ${alumnos.length} alumno${alumnos.length === 1 ? '' : 's'}</span>
            ${legajosIncompletos ? `<p class="ayuda-campo">${legajosIncompletos} con documentación pendiente · <a href="/legajos.html?curso=${curso.id}">ver legajos</a></p>` : ''}
            ${alumnos.length ? `
              <ol class="nomina">
                ${alumnos.map((a) => `
                  <li>
                    <a class="nomina-enlace" href="/boletin.html?id=${a.id}" title="Ver boletín">${esc(a.apellido)}, ${esc(a.nombre)}</a>
                    <span class="nomina-doc ${a.legajoCompleto ? 'ok' : ''}" title="Documentación entregada">
                      ${a.documentosCompletos}/${totalDocumentos}
                    </span>
                  </li>`).join('')}
              </ol>` : '<p class="anio-proximamente">Todavía no hay alumnos en este curso.</p>'}
          </div>

          <div class="anio-bloque">
            <span class="sub-titulo">Materias y docentes${sinDocente ? ` · ${sinDocente} sin asignar` : ''}</span>
            ${materias.length ? `
              <ul class="lista-materias-docentes">
                ${materias.map((m) => `
                  <li class="${m.profesor ? '' : 'sin-docente'}">
                    <span class="md-materia">${esc(m.nombre)}</span>
                    <span class="md-profesor">
                      ${m.profesor ? esc(m.profesor) : 'Sin docente'}
                      ${m.modulosEnHorario != null ? `<span class="md-modulos ${m.horas != null && m.horas !== m.modulosEnHorario ? 'desfasado' : ''}" title="Módulos en el horario / horas semanales asignadas">${m.modulosEnHorario}${m.horas != null ? '/' + m.horas : ''} mód.</span>` : (m.horas ? ` · ${m.horas} h` : '')}
                      ${m.asignacionId ? `<a class="md-notas" href="/notas.html?asignacion=${m.asignacionId}">notas</a>` : ''}
                    </span>
                  </li>`).join('')}
              </ul>` : '<p class="anio-proximamente">No hay materias cargadas para este año.</p>'}
          </div>
        </div>

        <div class="anio-bloque" style="margin-top:1.2rem">
          <span class="sub-titulo">Jornada y control del horario</span>
          ${bloqueJornada(curso, horario, modulos || [])}
        </div>`;

      det.querySelectorAll('.tabla-jornada tbody tr').forEach((tr) => {
        tr.querySelectorAll('select').forEach((sel) => sel.addEventListener('change', async () => {
          const desde = tr.querySelector('[data-campo="desde"]').value;
          const hasta = tr.querySelector('[data-campo="hasta"]').value;
          if ((desde && !hasta) || (!desde && hasta)) return; // esperar el otro extremo
          try {
            const r = await apiEnviar('PUT', `/api/horarios/curso/${curso.id}/jornada`, { dia: Number(tr.dataset.dia), desde: desde || null, hasta: hasta || null });
            App.toast(r.message);
          } catch (error) { App.toast(error.message); }
          await seleccionar(curso.id, true);
          await recargarResumen();
        }));
      });
    }

    async function cargar() {
      try {
        const data = await api('/api/cursos');
        estado.cursos = data.cursos;
        const totalAlumnos = data.cursos.reduce((s, c) => s + c.alumnos, 0);
        document.getElementById('subtitulo').textContent =
          `${data.cursos.length} divisiones · ${totalAlumnos} alumnos inscriptos`;

        const aviso = document.getElementById('aviso-sin-curso');
        if (data.alumnosSinCurso > 0) {
          aviso.innerHTML = `Hay <strong>${data.alumnosSinCurso}</strong> alumno${data.alumnosSinCurso === 1 ? '' : 's'} sin curso asignado. <a href="/alumnos.html">Asignar ahora</a>`;
          aviso.hidden = false;
        }
        renderCursos();
      } catch (error) {
        document.getElementById('cursos').innerHTML = `<p class="cargando">${esc(error.message)}</p>`;
      }
    }

    (async () => {
      const usuario = await App.exigirSesion();
      if (!usuario) return;
      App.montarBarraUsuario(usuario);
      if (usuario.rol !== 'secretaria' && usuario.rol !== 'director') {
        document.getElementById('cursos').innerHTML = '<p class="cargando">Tu rol no gestiona cursos.</p>';
        return;
      }
      await cargar();
    })();
  </script>
</body>
</html>
