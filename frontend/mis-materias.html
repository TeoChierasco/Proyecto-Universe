<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instituto Universe — Mis materias</title>
  <link rel="icon" type="image/svg+xml" href="/assets/isotipo.svg" />
  <script>document.documentElement.dataset.tema = localStorage.getItem('iu_tema') || 'claro';</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="contenido">
    <header class="barra-superior">
      <a href="/panel.html" class="enlace-volver">← Volver al panel</a>
      <div id="zona-usuario"></div>
    </header>

    <main class="main-top">
      <div class="aparecer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="panel-cabecera">
          <h1>Mis <span class="destello">materias</span></h1>
          <p class="subtitulo" id="subtitulo"></p>
        </div>

        <div class="filtros-asistencia" id="accesos" hidden>
          <a class="btn-mini" href="/horarios.html">Ver horario semanal</a>
          <a class="btn-mini" href="/boletin.html">Ver boletín</a>
        </div>

        <div class="cursos-docente lista-ancha" id="lista">
          <p class="cargando">Cargando tus materias…</p>
        </div>
      </div>
    </main>

    <footer class="pie">© 2026 Instituto Universe</footer>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    const fmt = (n) => (n == null ? '—' : String(n).replace('.', ','));

    async function api(ruta) {
      const r = await fetch(ruta, { headers: { Authorization: `Bearer ${App.obtenerToken()}` } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'Ocurrió un error.');
      return data;
    }

    (async () => {
      const usuario = await App.exigirSesion();
      if (!usuario) return;
      App.montarBarraUsuario(usuario);
      const cont = document.getElementById('lista');
      if (usuario.rol !== 'alumno') { cont.innerHTML = '<p class="cargando">Esta sección es para alumnos.</p>'; return; }
      try {
        const d = await api('/api/horarios/mis-materias');
        if (!d.curso) { cont.innerHTML = '<p class="cargando">Todavía no tenés curso asignado. Consultá en Secretaría.</p>'; return; }
        document.getElementById('subtitulo').textContent = `${d.curso.label} · ciclo ${d.ciclo} · ${d.materias.length} materias`;
        document.getElementById('accesos').hidden = false;
        cont.innerHTML = d.materias.map((m) => `
          <div class="tarjeta-docente">
            <span class="td-materia">${esc(m.materia)}</span>
            <span class="curso-dato">${m.profesor ? 'Prof. ' + esc(m.profesor) : 'Docente a confirmar'}</span>
            <div class="td-periodos">
              <span class="td-periodo">${m.modulos} módulo${m.modulos === 1 ? '' : 's'} por semana</span>
              ${m.dias.length ? `<span class="td-periodo">${m.dias.join(' · ')}</span>` : ''}
            </div>
            <div class="mm-promedio">
              <span class="tile-label">Promedio publicado</span>
              <span class="tile-valor ${m.promedio != null && m.promedio < d.notaAprobacion ? 'texto-alerta' : ''}">${fmt(m.promedio)}</span>
            </div>
          </div>`).join('');
      } catch (error) {
        cont.innerHTML = `<p class="cargando">${esc(error.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
