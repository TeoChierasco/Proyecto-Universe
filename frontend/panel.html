<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instituto Universe — Panel</title>
  <link rel="icon" type="image/svg+xml" href="/assets/isotipo.svg" />
  <script>document.documentElement.dataset.tema = localStorage.getItem('iu_tema') || 'claro';</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="contenido">
    <header class="barra-superior">
      <a href="/panel.html" class="marca"><img src="/assets/logo.svg" alt="Instituto Universe" /></a>
      <div id="zona-usuario"></div>
    </header>

    <main class="main-top">
      <div class="aparecer" id="contenido-panel" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="panel-cabecera">
          <h1>Hola, <span class="destello" id="saludo-nombre"></span></h1>
          <p class="subtitulo" id="contexto"></p>
        </div>
        <div class="tarjetas-panel" id="menu"></div>
      </div>
    </main>

    <footer class="pie">© 2026 Instituto Universe</footer>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const usuario = await App.exigirSesion();
      if (!usuario) return; // exigirSesion ya redirigió
      App.montarBarraUsuario(usuario);

      const rolNombre = (App.ROLES[usuario.rol] || {}).nombre || usuario.rol;
      const nivelNombre = (App.NIVELES[usuario.nivel] || {}).nombre || usuario.nivel;

      document.getElementById('saludo-nombre').textContent = usuario.nombre;
      document.getElementById('contexto').textContent = `${rolNombre} · ${nivelNombre}`;

      const secciones = (App.MENU_POR_ROL[usuario.rol] || []).concat(App.MENU_COMUN);
      document.getElementById('menu').innerHTML = secciones.map((s) => {
        if (s.link) {
          return `
            <a class="tarjeta-panel activa" href="${s.link}">
              <span class="insignia insignia-activo">Disponible</span>
              ${App.icono(s.icono, 'ico-tarjeta')}
              <h2>${s.titulo}</h2>
              <p>${s.desc}</p>
            </a>`;
        }
        return `
          <article class="tarjeta-panel">
            <span class="insignia insignia-proximamente">Próximamente</span>
            ${App.icono(s.icono, 'ico-tarjeta')}
            <h2>${s.titulo}</h2>
            <p>${s.desc}</p>
          </article>`;
      }).join('');
    })();
  </script>
</body>
</html>
