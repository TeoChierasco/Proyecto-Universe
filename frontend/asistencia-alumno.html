<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instituto Universe — Asistencia del alumno</title>
  <link rel="icon" type="image/svg+xml" href="/assets/isotipo.svg" />
  <script>document.documentElement.dataset.tema = localStorage.getItem('iu_tema') || 'claro';</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="contenido">
    <header class="barra-superior">
      <a href="#" class="enlace-volver" id="volver">← Volver</a>
      <div id="zona-usuario"></div>
    </header>

    <main class="main-top">
      <div class="aparecer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="panel-cabecera">
          <h1 id="titulo">Asistencia</h1>
          <p class="subtitulo" id="subtitulo"></p>
        </div>

        <div id="contenido" style="width:100%; display:flex; flex-direction:column; align-items:center;">
          <p class="cargando">Cargando…</p>
        </div>
      </div>
    </main>

    <footer class="pie">© 2026 Instituto Universe</footer>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const ESTADOS = { presente: 'Presente', tarde: 'Tarde', ausente: 'Ausente', retirado: 'Retirado' };
    const NIVELES = { normal: 'Dentro de lo esperado', atencion: 'Atención', critico: 'Crítico: cerca del tope', excedido: 'Superó el tope anual' };
    const fmtN = (n) => (n == null ? '—' : String(n).replace('.', ','));
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const params = new URLSearchParams(location.search);
    let alumnoIdParam = params.get('id');
    let permisos = {};

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function fechaCorta(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }
    function fechaHora(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        ' · ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    async function api(metodo, ruta, body) {
      const token = App.obtenerToken();
      const r = await fetch(ruta, {
        method: metodo,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'Ocurrió un error.');
      return data;
    }

    function filaHistorial(h) {
      const clase = { presente: 'insignia-activo', ausente: 'insignia-ausente', retirado: 'insignia-retirado', tarde: 'insignia-retirado' }[h.estado];
      const materia = h.estado === 'retirado' && h.materia ? ` · ${esc(h.materia)}` : '';
      const justif = h.justificada ? '<span class="chip-justif">Justificada</span>' : '';
      const obs = h.observacion ? `<span class="codigo-meta">${esc(h.observacion)}</span>` : '';
      let accion = '';
      if (permisos.justificar && h.estado !== 'presente') {
        accion = h.justificada
          ? `<button class="btn-mini" data-just="${h.id}" data-val="0">Quitar justif.</button>`
          : `<button class="btn-mini" data-just="${h.id}" data-val="1">Justificar</button>`;
      }
      return `
        <div class="fila-usuario">
          <div class="fila-info">
            <span class="usuario-nombre-lista">${fechaCorta(h.fecha)}
              <span class="insignia ${clase}" style="position:static; margin-left:.4rem;">${ESTADOS[h.estado]}${materia}</span> ${justif}
            </span>
            ${obs}
          </div>
          <div class="fila-acciones">${accion}</div>
        </div>`;
    }

    function render(data) {
      const a = data.alumno;
      permisos = data.permisos;
      document.getElementById('titulo').innerHTML = `${esc(a.apellido)}, <span class="destello">${esc(a.nombre)}</span>`;
      document.getElementById('subtitulo').textContent =
        `${a.curso ? a.curso + ' · ' : ''}DNI ${esc(a.documento || '—')}`;

      const c = data.computo;
      const v = data.valores || {};
      const pctTope = Math.min(100, (c.faltas / c.limite) * 100);
      const cont = document.getElementById('contenido');
      cont.innerHTML = `
        <section class="computo lista-ancha">
          <div class="computo-cabecera">
            <div>
              <span class="sub-titulo">Inasistencias · ciclo ${data.ciclo}</span>
              <div class="computo-total"><strong>${fmtN(c.faltas)}</strong> de ${c.limite}
                <span class="nivel-faltas nivel-${c.nivel}">${NIVELES[c.nivel]}</span></div>
            </div>
            <div class="computo-restan">${c.faltas >= c.limite ? 'Sin margen' : `Quedan <strong>${fmtN(c.restan)}</strong>`}</div>
          </div>
          <div class="medidor medidor-${c.nivel}" role="meter" aria-valuemin="0" aria-valuemax="${c.limite}" aria-valuenow="${c.faltas}"
               aria-label="${fmtN(c.faltas)} inasistencias de ${c.limite}">
            <span style="width:${pctTope}%"></span>
          </div>
          <div class="tiles tiles-chicos">
            <div class="tile"><span class="tile-label">Ausencias</span><span class="tile-valor">${c.ausencias}</span></div>
            <div class="tile"><span class="tile-label">Llegadas tarde</span><span class="tile-valor">${c.tardes}</span></div>
            <div class="tile"><span class="tile-label">Retiros</span><span class="tile-valor">${c.retiros}</span></div>
            <div class="tile"><span class="tile-label">Justificadas</span><span class="tile-valor">${fmtN(c.justificadas)}</span></div>
            <div class="tile"><span class="tile-label">Presentismo</span><span class="tile-valor">${c.presentismo == null ? '—' : fmtN(c.presentismo) + ' %'}</span></div>
          </div>
          ${data.porMes.length ? `
            <table class="planilla tabla-meses">
              <thead><tr><th class="col-alumno">Mes</th><th>Días</th><th>Ausencias</th><th>Tardes</th><th>Retiros</th><th>Faltas</th></tr></thead>
              <tbody>
                ${data.porMes.map((m) => `<tr>
                  <td class="col-alumno">${MESES[Number(m.mes.slice(5)) - 1]}</td>
                  <td>${m.dias}</td><td>${m.ausencias}</td><td>${m.tardes}</td><td>${m.retiros}</td>
                  <td><strong>${fmtN(m.faltas)}</strong></td></tr>`).join('')}
              </tbody>
            </table>` : ''}
          <p class="ayuda-campo">Cómputo: ausente = ${fmtN(v.ausente ?? 1)} · retiro = ${fmtN(v.retirado ?? 0.5)} · llegada tarde = ${fmtN(v.tarde ?? 0.25)}. Las faltas justificadas también suman al tope anual.</p>
        </section>

        ${permisos.avisar ? `
        <form class="tarjeta-form" id="form-aviso" style="max-width:640px;">
          <h2 class="titulo-tarjeta">Enviar aviso a la familia</h2>
          <div class="campo">
            <textarea id="aviso-msg" rows="3" maxlength="500" placeholder="Ej: Su hijo/a acumula 5 inasistencias. Por favor comunicarse con el instituto."></textarea>
          </div>
          <div class="mensaje-form" id="msg-aviso"></div>
          <button type="submit" class="boton boton-primario" id="btn-aviso">Enviar aviso</button>
        </form>` : ''}

        ${data.avisos.length ? `
          <h2 class="titulo-lista" style="max-width:640px; width:100%;">Avisos enviados a la familia</h2>
          <div class="lista-usuarios" style="max-width:640px;">
            ${data.avisos.map((v) => `
              <div class="comunicado" style="width:100%;">
                <p class="com-cuerpo">${esc(v.mensaje)}</p>
                <div class="com-foot"><span class="com-autor">${v.automatico ? 'Aviso automático del sistema' : `${esc(v.emitido_nombre || '')} · ${esc(v.emitido_rol || '')}`} · ${fechaHora(v.creado_en)}</span></div>
              </div>`).join('')}
          </div>` : ''}

        <div class="historial-cabecera" style="max-width:640px; width:100%;">
          <h2 class="titulo-lista">Historial</h2>
          <label class="filtro-etiqueta"><input type="checkbox" id="ver-todos" ${verTodos ? 'checked' : ''} /> Mostrar también los días presentes</label>
        </div>
        <div class="lista-usuarios" id="historial" style="max-width:640px;">
          ${(() => {
            const lista = verTodos ? data.historial : data.historial.filter((h) => h.estado !== 'presente');
            if (!data.historial.length) return '<p class="cargando">Sin registros de asistencia todavía.</p>';
            if (!lista.length) return '<p class="cargando">Sin inasistencias, llegadas tarde ni retiros. ¡Muy bien!</p>';
            return lista.map(filaHistorial).join('');
          })()}
        </div>`;

      document.getElementById('ver-todos').addEventListener('change', (e) => { verTodos = e.target.checked; render(data); });
      // Justificar / quitar justificación (preceptor)
      cont.querySelectorAll('[data-just]').forEach((b) =>
        b.addEventListener('click', () => justificar(b.dataset.just, b.dataset.val === '1')));

      // Enviar aviso
      const formAviso = document.getElementById('form-aviso');
      if (formAviso) {
        formAviso.addEventListener('submit', async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById('msg-aviso');
          const mensaje = document.getElementById('aviso-msg').value.trim();
          App.ocultarMensaje(msgBox);
          if (!mensaje) { App.mostrarMensaje(msgBox, 'Escribí el mensaje del aviso.', 'error'); return; }
          try {
            const r = await api('POST', '/api/asistencia/aviso', { alumnoId: alumnoIdReal, mensaje });
            App.toast(r.message);
            await cargar();
          } catch (error) {
            App.mostrarMensaje(msgBox, error.message, 'error');
          }
        });
      }
    }

    async function justificar(id, valor) {
      let observacion = '';
      if (valor) {
        observacion = window.prompt('Motivo / certificado (opcional):', '') || '';
      }
      try {
        const r = await api('PATCH', `/api/asistencia/${id}/justificar`, { justificada: valor, observacion });
        App.toast(r.message);
        await cargar();
      } catch (error) {
        App.toast(error.message);
      }
    }

    let alumnoIdReal = null;
    let verTodos = false;
    async function cargar() {
      try {
        const data = await api('GET', `/api/asistencia/alumno/${alumnoIdParam}`);
        render(data);
      } catch (error) {
        document.getElementById('contenido').innerHTML = `<p class="cargando">${esc(error.message)}</p>`;
      }
    }

    (async () => {
      const usuario = await App.exigirSesion();
      if (!usuario) return;
      App.montarBarraUsuario(usuario);

      // El alumno ve su propia asistencia; los padres vienen con ?id.
      if (!alumnoIdParam) {
        if (usuario.rol === 'alumno') alumnoIdParam = 'mi';
        else { document.getElementById('contenido').innerHTML = '<p class="cargando">Falta indicar el alumno.</p>'; return; }
      }
      alumnoIdReal = alumnoIdParam === 'mi' ? usuario.id : alumnoIdParam;

      // Botón volver: al panel o a la lista según el rol.
      document.getElementById('volver').setAttribute('href',
        (usuario.rol === 'preceptor' || usuario.rol === 'secretaria' || usuario.rol === 'director') ? '/asistencia.html'
          : (usuario.rol === 'padre' ? '/hijos.html' : '/panel.html'));

      await cargar();
    })();
  </script>
</body>
</html>
